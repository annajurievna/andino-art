<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Andino Art</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0d0d;--surface:#161616;--surface2:#1f1f1f;
  --border:#272420;--text:#e8e2d4;--muted:#6e6456;
  --gold:#c9a84c;--gold-lt:#e0c060;--gold-dk:#9a7830;--white:#f5f0e8;
  --red:#8b2020;--red-lt:#c05050;--red-bg:#2a0a0a;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-weight:300;line-height:1.75;min-height:100vh;display:flex;flex-direction:column}

/* ── LOGIN ── */
.login-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:2rem}
.login-box{background:var(--surface);border:1px solid var(--border);padding:3rem 2.5rem;width:100%;max-width:360px;text-align:center}
.login-logo{font-family:'Cinzel',serif;font-size:1rem;font-weight:700;letter-spacing:.2em;color:var(--gold);margin-bottom:.4rem}
.login-sub{font-size:.72rem;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-bottom:2rem}
.login-box input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:.78rem 1rem;font-family:'Inter',sans-serif;font-size:.95rem;outline:none;border-radius:0;margin-bottom:1rem;transition:border-color .2s}
.login-box input:focus{border-color:var(--gold-dk)}
.login-box button{width:100%;background:var(--gold);color:var(--bg);border:none;padding:.85rem;font-family:'Inter',sans-serif;font-size:.72rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;transition:background .2s}
.login-box button:hover{background:var(--gold-lt)}
.login-err{font-size:.78rem;color:var(--red-lt);margin-top:.8rem;display:none}

/* ── ADMIN WRAP ── */
.admin-wrap{display:none;flex-direction:column;flex:1;padding:2rem}
.admin-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem;padding-bottom:1.2rem;border-bottom:1px solid var(--border)}
.admin-title{font-family:'Cinzel',serif;font-size:1rem;font-weight:700;letter-spacing:.15em;color:var(--gold)}
.admin-subtitle{font-size:.72rem;color:var(--muted);margin-top:.2rem}
.logout-btn{background:none;border:1px solid var(--border);color:var(--muted);padding:.4rem .9rem;font-family:'Inter',sans-serif;font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:all .2s}
.logout-btn:hover{border-color:var(--red);color:var(--red-lt)}

/* ── WEEK NAV ── */
.week-nav{display:flex;align-items:center;gap:.75rem;margin-bottom:.85rem}
.week-arrow{background:none;border:1px solid var(--border);color:var(--muted);width:30px;height:30px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1rem;transition:all .2s;flex-shrink:0;line-height:1;padding:0}
.week-arrow:hover:not(:disabled){border-color:var(--gold-dk);color:var(--gold)}
.week-arrow:disabled{opacity:.22;cursor:default}
.week-label-text{font-size:.72rem;color:var(--muted);letter-spacing:.05em;flex:1;text-align:center;white-space:nowrap}

/* ── SLOT GRID ── */
.slots-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.slots-wrap::-webkit-scrollbar{height:4px}
.slots-wrap::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.slots-grid{display:grid;gap:2px;width:max-content}
.s-head{font-size:.6rem;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:.45rem .2rem;text-align:center;line-height:1.4}
.s-head.today-col{color:var(--gold)}
.s-head strong{font-size:.78rem;color:var(--text);font-weight:600;display:block}
.s-row-label{font-size:.62rem;color:var(--muted);padding:.55rem .6rem .55rem 0;display:flex;align-items:center;white-space:nowrap}
.slot{background:var(--surface2);border:1px solid var(--border);padding:.5rem .15rem;font-size:.6rem;text-align:center;cursor:pointer;color:var(--muted);transition:all .2s;user-select:none;line-height:1.2}
.slot:hover{border-color:var(--gold-dk);color:var(--gold)}
.slot.blocked{background:var(--red-bg);border-color:var(--red);color:var(--red-lt)}
.slot.blocked:hover{background:#3a0e0e;border-color:var(--red-lt)}
.slot.past{opacity:.25;cursor:default;pointer-events:none}

/* ── LEGEND ── */
.legend{display:flex;gap:1.4rem;margin-top:1rem;font-size:.68rem;color:var(--muted)}
.leg{display:flex;align-items:center;gap:.45rem}
.leg-box{width:9px;height:9px;border:1px solid}
.leg-box.av{border-color:var(--border);background:var(--surface2)}
.leg-box.bl{border-color:var(--red);background:var(--red-bg)}

/* ── TOAST ── */
.toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--gold-dk);color:var(--gold);padding:.65rem 1.4rem;font-size:.75rem;letter-spacing:.1em;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}

@media(max-width:480px){
  .admin-wrap{padding:1.2rem}
  .week-label-text{font-size:.6rem;white-space:normal}
  .week-arrow{width:26px;height:26px}
  .s-head{font-size:.55rem}
  .s-head strong{font-size:.7rem}
  .s-row-label{font-size:.58rem;padding:.5rem .4rem .5rem 0}
  .slot{font-size:.55rem;padding:.45rem .1rem}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="loginWrap">
  <div class="login-box">
    <p class="login-logo">ANDINO ART</p>
    <p class="login-sub">Panel de administración</p>
    <input type="password" id="pwdInput" placeholder="Contraseña" autocomplete="current-password">
    <button id="loginBtn">Entrar</button>
    <p class="login-err" id="loginErr">Contraseña incorrecta</p>
  </div>
</div>

<!-- ADMIN -->
<div class="admin-wrap" id="adminWrap">
  <div class="admin-header">
    <div>
      <p class="admin-title">ANDINO ART — ADMIN</p>
      <p class="admin-subtitle">Haz clic en un horario para bloquearlo o desbloquearlo</p>
    </div>
    <button class="logout-btn" id="logoutBtn">Cerrar sesión</button>
  </div>

  <div class="week-nav">
    <button class="week-arrow" id="weekPrev" disabled>&#8592;</button>
    <span class="week-label-text" id="weekLabel"></span>
    <button class="week-arrow" id="weekNext">&#8594;</button>
  </div>
  <div class="slots-wrap">
    <div class="slots-grid" id="slotsGrid"></div>
  </div>
  <div class="legend">
    <div class="leg"><div class="leg-box av"></div> Disponible</div>
    <div class="leg"><div class="leg-box bl"></div> Bloqueado</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  var pwd = localStorage.getItem('adminPwd') || '';
  var blocked = new Set();
  var weekOffset = 0;

  var days   = ['Lun','Mar','Mié','Jue','Vie','Sáb'];
  var months = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  var rowLabels = ['Mañana<br>9–14','Tarde<br>14–19','Noche<br>19–23'];
  var rowKeys   = ['AM','PM','EV'];

  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function () { t.classList.remove('show'); }, 2000);
  }

  function fmtKey(dt) {
    return dt.getFullYear() + '-' +
      String(dt.getMonth()+1).padStart(2,'0') + '-' +
      String(dt.getDate()).padStart(2,'0');
  }

  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html !== undefined) e.innerHTML = html;
    return e;
  }

  function buildGrid() {
    var grid = document.getElementById('slotsGrid');
    grid.innerHTML = '';
    var today = new Date(); today.setHours(0,0,0,0);
    var weekStart = new Date(today);
    weekStart.setDate(weekStart.getDate() + weekOffset * 7);

    var dates = [];
    for (var i = 0; i < 7; i++) {
      var d = new Date(weekStart); d.setDate(d.getDate() + i);
      if (d.getDay() >= 1 && d.getDay() <= 6) dates.push(new Date(d));
    }

    var mobile = window.innerWidth <= 480;
    var colW = mobile ? '50px' : '66px';
    var lblW = mobile ? '56px' : '72px';
    grid.style.gridTemplateColumns = lblW + ' repeat(' + (dates.length || 1) + ', ' + colW + ')';

    var labelEl = document.getElementById('weekLabel');
    if (dates.length > 0) {
      var first = dates[0], last = dates[dates.length-1];
      if (first.getMonth() === last.getMonth()) {
        labelEl.textContent = first.getDate() + ' – ' + last.getDate() + ' ' + months[first.getMonth()] + ' ' + first.getFullYear();
      } else {
        labelEl.textContent = first.getDate() + ' ' + months[first.getMonth()] + ' – ' + last.getDate() + ' ' + months[last.getMonth()] + ' ' + last.getFullYear();
      }
    }

    document.getElementById('weekPrev').disabled = (weekOffset === 0);
    document.getElementById('weekNext').disabled = (weekOffset === 11);

    var todayStr = fmtKey(today);
    grid.appendChild(el('div','s-head'));
    dates.forEach(function(dt) {
      var cls = 's-head' + (fmtKey(dt) === todayStr ? ' today-col' : '');
      grid.appendChild(el('div', cls, days[dt.getDay()-1] + '<br><strong>' + dt.getDate() + '</strong>&nbsp;' + months[dt.getMonth()]));
    });

    rowLabels.forEach(function(label, ri) {
      grid.appendChild(el('div','s-row-label', label));
      dates.forEach(function(dt) {
        var key = fmtKey(dt) + '-' + rowKeys[ri];
        var past = dt.getTime() < today.getTime();
        var isBlocked = blocked.has(key);
        var cls = 'slot' + (past ? ' past' : '') + (isBlocked ? ' blocked' : '');
        var s = el('div', cls, isBlocked ? '✕' : '');
        s.dataset.key = key;
        if (!past) {
          s.addEventListener('click', function() { toggleSlot(key, s); });
        }
        grid.appendChild(s);
      });
    });
  }

  function toggleSlot(key, el) {
    fetch('/api/admin/slots/toggle', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-admin-password': pwd },
      body: JSON.stringify({ slotKey: key })
    })
    .then(function(r) {
      if (r.status === 401) { logout(); return; }
      return r.json();
    })
    .then(function(data) {
      if (!data) return;
      if (data.blocked) {
        blocked.add(key);
        el.classList.add('blocked');
        el.textContent = '✕';
        showToast('Bloqueado');
      } else {
        blocked.delete(key);
        el.classList.remove('blocked');
        el.textContent = '';
        showToast('Desbloqueado');
      }
    })
    .catch(function() { showToast('Error'); });
  }

  function loadBlocked() {
    fetch('/api/slots/blocked')
      .then(function(r) { return r.json(); })
      .then(function(keys) {
        blocked = new Set(keys);
        buildGrid();
      });
  }

  function login(password) {
    fetch('/api/admin/slots/toggle', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-admin-password': password },
      body: JSON.stringify({ slotKey: '__test__' })
    }).then(function(r) {
      if (r.status === 401) {
        document.getElementById('loginErr').style.display = 'block';
      } else {
        pwd = password;
        localStorage.setItem('adminPwd', pwd);
        showAdmin();
      }
    }).catch(function() {
      document.getElementById('loginErr').style.display = 'block';
    });
  }

  function showAdmin() {
    document.getElementById('loginWrap').style.display = 'none';
    document.getElementById('adminWrap').style.display = 'flex';
    loadBlocked();
  }

  function logout() {
    pwd = '';
    localStorage.removeItem('adminPwd');
    document.getElementById('loginWrap').style.display = 'flex';
    document.getElementById('adminWrap').style.display = 'none';
    document.getElementById('pwdInput').value = '';
    document.getElementById('loginErr').style.display = 'none';
  }

  // Events
  document.getElementById('loginBtn').addEventListener('click', function() {
    var p = document.getElementById('pwdInput').value.trim();
    if (p) login(p);
  });
  document.getElementById('pwdInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') document.getElementById('loginBtn').click();
  });
  document.getElementById('logoutBtn').addEventListener('click', logout);
  document.getElementById('weekPrev').addEventListener('click', function() {
    if (weekOffset > 0) { weekOffset--; buildGrid(); }
  });
  document.getElementById('weekNext').addEventListener('click', function() {
    if (weekOffset < 11) { weekOffset++; buildGrid(); }
  });
  window.addEventListener('resize', buildGrid);

  // Auto-login if password saved
  if (pwd) {
    login(pwd);
  }
})();
</script>
</body>
</html>
